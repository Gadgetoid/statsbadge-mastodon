[project]
name = "statsbadge-mastodon"
dynamic = ["version"]
description = "Your Mastodon timeline and account as statsbadge readings"
readme = "README.md"
authors = [
    { name = "Philip Howard", email = "phil@pimoroni.com" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = ["statsbadge>=1.1.0"]

[project.urls]
Homepage = "https://github.com/pimoroni/statsbadge-mastodon"
Repository = "https://github.com/pimoroni/statsbadge-mastodon"
Issues = "https://github.com/pimoroni/statsbadge-mastodon/issues"

# The whole extension mechanism is this one entry point: the server finds the class and
# runs it as a source. The messages it puts in the frame are drawn by the app's own
# `notify` page, so there is no badge module to push.
[project.entry-points."statsbadge.sources"]
mastodon = "statsbadge_mastodon:Mastodon"

# The tag is the version.
[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/statsbadge_mastodon"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"
